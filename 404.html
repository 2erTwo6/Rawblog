<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- JS 不可用时的兜底；JS 正常时会在毫秒级先跳走 -->
  <meta http-equiv="refresh" content="3; url=/">
  <title>404 · 2erTwo6的博客</title>
  <style>
    /* 自包含样式：404 可能出现在任意深度，相对引用 style.css 会失效 */
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #fffdfa; color: #222;
      font: 17px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #14161a; color: #ddd; } }
    h1 { font-size: 3.5rem; margin: 0; }
    p { color: #777; margin: .5rem 0 1.5rem; }
    @media (prefers-color-scheme: dark) { p { color: #999; } }
    a { color: #0a66c2; text-decoration: none; }
    @media (prefers-color-scheme: dark) { a { color: #7ab8ff; } }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这个页面不存在，马上带你回首页……</p>
    <a id="home" href="/">← 回首页</a>
  </main>

  <script>
    // 自动定位站点根再跳转：兼容 GitHub Pages 项目站（/Rawblog/…）与根路径部署。
    // 原理：有效内容只存在于站点根和 NNN/ 里，逐个候选前缀探测 404.html 本身，
    // 能取到它的那个前缀就是站点根。
    (async () => {
      const segs = location.pathname.split('/');
      const candidates = [];
      // 项目页形如 /<repo>/<path>：仅当当前至少还有一层真实路径时才把首段当 repo
      if (segs.length > 2 && segs[2] !== '') candidates.push('/' + segs[1] + '/');
      candidates.push('/');

      let root = '/';
      for (const c of candidates) {
        try { if ((await fetch(c + '404.html')).ok) { root = c; break; } } catch {}
      }

      document.getElementById('home').href = root;
      location.replace(root); // replace：不让 404 地址留在历史记录里
    })();
  </script>
</body>
</html>
